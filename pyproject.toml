[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fracatlas-fracture-benchmark"
version = "0.2.0"
description = "Fracture classification, localisation, calibration and abstention on FracAtlas musculoskeletal X-rays."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Muzammal Hussain"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "pillow>=10", "matplotlib>=3.7"]

[project.optional-dependencies]
train = ["torch>=2.3", "torchvision>=0.18", "timm>=1.0", "ultralytics>=8.3"]
dev = ["pytest>=7.4"]

[project.scripts]
fracatlas = "fracatlas_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
